name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Android SDK tools and build prerequisites
        env:
          ANDROID_HOME: ${{ runner.temp }}/moonshot-android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/moonshot-android-sdk
        run: bash scripts/ci-android-setup.sh
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Package APKs, source, reports and checksums
        run: bash scripts/package-development.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moonshot-development-build
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  tv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install verified Android SDK tools and build prerequisites
        env:
          ANDROID_HOME: ${{ runner.temp }}/moonshot-android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/moonshot-android-sdk
        run: bash scripts/ci-android-setup.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.moonshot.resetTestData=true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tv-smoke-reports
          path: app/build/reports/androidTests/
  publish-development:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: moonshot-development-build
          path: dist
      - name: Publish downloadable development build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="dev-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<'NOTES'
          Download **moonshot-test.apk** to sideload the development build.
          The optimized release APK is unsigned and requires signing before installation.

          Includes source, validation reports, build metadata and SHA-256 checksums.
          Unit tests and lint passed before packaging. These builds are development
          candidates; provider and physical-device acceptance remain required.
          The separate TV emulator job's result is available in the linked workflow run.

          CI currently generates a development signing key per runner. Updates from
          another build may require uninstalling the old app, which deletes its local
          data. Export a library backup first where supported. Stable production
          signing has not been configured.
          NOTES
          printf '\nWorkflow: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Moonshot development build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release-notes.md
